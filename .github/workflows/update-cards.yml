
name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # jednou denně o půlnoci
  workflow_dispatch: # umožní ruční spuštění tlačítkem v Actions tabu

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Dinouseg&show_icons=true&theme=dark&hide_border=true&bg_color=0d0d0d&title_color=86D9A4&icon_color=86D9A4&text_color=ffffff
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Dinouseg&layout=compact&theme=dark&hide_border=true&bg_color=0d0d0d&title_color=86D9A4&text_color=ffffff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
